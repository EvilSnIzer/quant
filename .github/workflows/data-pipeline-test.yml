name: Data Pipeline Test
on:
  push:
    branches: [arena/**]
    paths: [".github/workflows/data-pipeline-test.yml", "scripts/fetch_smoke.py"]

permissions:
  contents: write

jobs:
  fetch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install yfinance pandas
      - name: Smoke fetch
        run: |
          mkdir -p data
          python scripts/fetch_smoke.py 2>&1 | tee data/.actions_log.txt
      - name: Commit artifacts
        if: always()
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add -A data/ || true
          git commit -m "chore: smoke test artifacts" || echo "nothing to commit"
          git push
